org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Workarounds for Kotlin incremental/cache issues on Windows when project and
# Pub cache are on different drives. Disables Kotlin incremental compilation
# and forces in-process compilation to avoid "different roots" and daemon
# related errors during Kotlin compilation.
kotlin.incremental=false
kotlin.daemon.enabled=false
kotlin.compiler.execution.strategy=in-process

name: roadeyeai
description: RoadEye AI - Smart Vehicle Detection System
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.2

  # Permissions - UPDATED
  permission_handler: ^11.3.1 # ✅ Updated from 10.0.0 to 11.3.1

  # State Management
  provider: ^6.1.2

  # Google Maps
  google_maps_flutter: ^2.9.0

  # HTTP requests
  http: ^1.2.2 # ✅ Updated from 1.1.0 to 1.2.2

  # Local Storage
  shared_preferences: ^2.3.2

  # File Management
  camera: ^0.10.5+5
  path_provider: ^2.1.4
  file_picker: ^8.1.4 # ✅ CRITICAL FIX: Updated from 6.1.1 to 8.1.4 (fixes build error)

  # Sharing
  share_plus: ^10.1.2

  # CSV Export
  csv: ^6.0.0

  # Date Formatting
  intl: ^0.19.0 # ✅ Updated from 0.18.1 to 0.19.0

  # Notifications - UPDATED
  flutter_local_notifications: ^17.2.3 # ✅ Updated from 14.0.0 to 17.2.3

  # Vibration
  vibration: ^2.0.0

  # Audio
  audioplayers: ^6.1.0

  # UI Components
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 #✅ Updated from 0.13.1 to 0.14.1
  
    
# ✅ Updated from 3.0.0 to 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_logo.png
    - assets/icons/app_icon.png

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  # Optional: Add different icon for iOS
  # ios_icon_path: "assets/icons/app_icon_ios.png"
  # Optional: Remove alpha channel for iOS
  remove_alpha_ios: true
